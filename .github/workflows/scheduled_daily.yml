name: Scheduled Daily Jobs

on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "10 17 * * *"
    - cron: "20 17 * * *"
    - cron: "30 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "要執行的任務"
        required: true
        default: "all"
        type: choice
        options: [all, schedule_report, staff_schedule, orders_report, staff_info, notify]

permissions:
  contents: write

jobs:
  run-daily-jobs:
    runs-on: ubuntu-latest
    env:
      DAILY_ROOT_FOLDER_ID: "11O6eKHQ1e3Irqps7Kq1XJOSVVge3pCAc"
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      TOOLS_APP_LOG_SPREADSHEET_ID: ${{ secrets.TOOLS_APP_LOG_SPREADSHEET_ID || secrets.MASTER_SPREADSHEET_ID }}
      MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
      TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
      TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
      TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
      TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      NOTIFY_PASSWORD: ${{ secrets.NOTIFY_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Verify Jenny OAuth secrets
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
      - name: Decide task
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TASK="${{ github.event.inputs.target }}"; else
            HM=$(date -u +"%H:%M")
            case "$HM" in
              17:00) TASK="schedule_report" ;;
              17:10) TASK="staff_schedule" ;;
              17:20) TASK="orders_report" ;;
              17:30) TASK="staff_info" ;;
              18:00) TASK="notify" ;;
              *) TASK="none" ;;
            esac
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
      - name: Run daily task
        shell: bash
        run: |
          set +e
          TODAY=$(TZ=Asia/Taipei date +"%Y%m%d")
          LOG_DIR="logs/$TODAY"; mkdir -p "$LOG_DIR"
          TASK="${{ steps.decide.outputs.task }}"; FAILED=0
          run_one () {
            NAME="$1"; CMD="$2"; START_TS=$(date +%s); START_TEXT=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S")
            bash -lc "$CMD" > "$LOG_DIR/$NAME.log" 2>&1; EXIT_CODE=$?
            END_TS=$(date +%s); END_TEXT=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S"); DURATION=$((END_TS-START_TS))
            echo "$EXIT_CODE" > "$LOG_DIR/$NAME.exit"
            [ "$EXIT_CODE" -eq 0 ] && STATUS="success" || STATUS="failed"
            printf '{"job_name":"%s","status":"%s","exit_code":%s,"started_at":"%s","finished_at":"%s","duration_seconds":%s}\n' "$NAME" "$STATUS" "$EXIT_CODE" "$START_TEXT" "$END_TEXT" "$DURATION" > "$LOG_DIR/$NAME.json"
            cat "$LOG_DIR/$NAME.log"; [ "$EXIT_CODE" -ne 0 ] && FAILED=1; return 0
          }
          [ "$TASK" = "schedule_report" ] || [ "$TASK" = "all" ] && run_one schedule_report "python -u tools/scheduled_daily/scheduler.py --target schedule_report --folder-id '$DAILY_ROOT_FOLDER_ID'"
          [ "$TASK" = "staff_schedule" ] || [ "$TASK" = "all" ] && run_one staff_schedule "python -u tools/scheduled_daily/scheduler.py --target staff_schedule --folder-id '$DAILY_ROOT_FOLDER_ID'"
          [ "$TASK" = "orders_report" ] || [ "$TASK" = "all" ] && run_one orders_report "python -u tools/scheduled_daily/scheduler.py --target orders_report --folder-id '$DAILY_ROOT_FOLDER_ID'"
          [ "$TASK" = "staff_info" ] || [ "$TASK" = "all" ] && run_one staff_info "python -u tools/scheduled_daily/scheduler.py --target staff_info --folder-id '$DAILY_ROOT_FOLDER_ID'"
          [ "$TASK" = "notify" ] || [ "$TASK" = "all" ] && run_one send_daily_result "python -u tools/notify/send_daily_result.py"
          [ "$FAILED" -ne 0 ] && exit 1 || exit 0
      - name: Commit logs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f logs
          if ! git diff --cached --quiet; then
            git commit -m "Update daily logs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
