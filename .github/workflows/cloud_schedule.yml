name: Cloud Schedule Router
run-name: cloud-router-${{ inputs.timestamp }}
on:
  workflow_dispatch:
    inputs:
      timestamp:
        description: Unix timestamp supplied by cron-job.org
        required: true
        type: string
      dry_run:
        description: Validate the schedule without dispatching tasks
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: cloud-schedule-router
  cancel-in-progress: false
jobs:
  route:
    if: vars.EXTERNAL_SCHEDULER_ENABLED == 'true' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib
      - name: Dispatch scheduled functions（主控表「排程設定」）
        env:
          GH_TOKEN: ${{ github.token }}
          # 派送到 order-system（週末提醒）用；fine-grained token，order-system 的 Actions: Read and write
          ORDER_SYSTEM_DISPATCH_TOKEN: ${{ secrets.ORDER_SYSTEM_DISPATCH_TOKEN }}
          # 派送到 investment-system（月底轉值／月初換欄）用；fine-grained token，investment-system 的 Actions: Read and write
          INVESTMENT_SYSTEM_DISPATCH_TOKEN: ${{ secrets.INVESTMENT_SYSTEM_DISPATCH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TOOLS_APP_LOG_SPREADSHEET_ID: ${{ secrets.TOOLS_APP_LOG_SPREADSHEET_ID || secrets.MASTER_SPREADSHEET_ID }}
          SLOT_TIMESTAMP: ${{ inputs.timestamp }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/cloud_schedule.py --timestamp "$SLOT_TIMESTAMP" "${args[@]}"
