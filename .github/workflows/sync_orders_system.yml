name: Sync tools/orders_system from orders-system

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tool-system
        uses: actions/checkout@v4

      - name: Fetch latest orders-system
        run: git clone --depth 1 https://github.com/jenny-smart/orders-system.git /tmp/orders-system

      - name: Copy synced files
        run: |
          set -e
          DEST=tools/orders_system
          # 只同步這份清單裡的檔案。
          # 不同步：env.py、requirements.txt（兩邊環境設定/依賴各自獨立，env.py 含金鑰）、
          #        memo_system/、ui.py、__init__.py、README.md（tool-system 專屬墊片與包裝，
          #        依 tools/orders_system/memo_system/ui.py 內的說明手動維護，不可被覆蓋）。
          FILES=(
            accounts.py
            ai_cleaning_estimate.py
            cancel_order.py
            cancel_order_test_app.py
            cleaner_reminders.py
            next_service_dates.py
            orders.py
            ordersapp.py
            quick_order.py
            vip_calendar_patch.py
            vip_calendar_patch2.py
            vip_calendar_patch3.py
            vip_calendar_patch4.py
            vip_calendar_patch5.py
            vip_calendar_sync.py
            vip_calendar_test_app.py
            weekend_reminders.py
          )
          for f in "${FILES[@]}"; do
            if [ -f "/tmp/orders-system/$f" ]; then
              cp "/tmp/orders-system/$f" "$DEST/$f"
            else
              echo "::warning::orders-system 找不到 $f，跳過同步"
            fi
          done

      - name: Commit and push directly to main
        run: |
          set -e
          git add tools/orders_system
          if git diff --cached --quiet; then
            echo "No changes detected, nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync tools/orders_system from orders-system"
          git push origin HEAD:main
