name: Scheduled Monthly Jobs

on:
  workflow_dispatch:
    inputs:
      target:
        description: "要執行的任務"
        required: true
        default: "half_month_orders_2"
        type: choice
        options: [all, half_month_orders_1, half_month_orders_2, refund_report, prepaid_report, stored_value_settlement, stored_value_prepaid]
      period:
        description: "期別（例如：202605-1 或 202605-2）"
        required: false
        default: ""
      folder_id:
        description: "月排程總根目錄 ID（留空使用預設）"
        required: false
        default: ""
      area:
        description: "執行區域（all / 台北 / 台中 / 桃園 / 新竹 / 高雄）"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  run-monthly-jobs:
    runs-on: ubuntu-latest
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      TOOLS_APP_LOG_SPREADSHEET_ID: ${{ secrets.TOOLS_APP_LOG_SPREADSHEET_ID || secrets.MASTER_SPREADSHEET_ID }}
      MONTHLY_ROOT_FOLDER_ID: "1TnV_tpDnaSwPDDvjq8AtGL6uRC0OwGUK"
      MONTHLY_ORDERS_ROOT_FOLDER_ID: ${{ secrets.MONTHLY_ORDERS_ROOT_FOLDER_ID }}
      TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
      TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
      TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
      TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
      TAOYUAN_EMAIL: ${{ secrets.TAOYUAN_EMAIL }}
      TAOYUAN_PASSWORD: ${{ secrets.TAOYUAN_PASSWORD }}
      HSINCHU_EMAIL: ${{ secrets.HSINCHU_EMAIL }}
      HSINCHU_PASSWORD: ${{ secrets.HSINCHU_PASSWORD }}
      KAOHSIUNG_EMAIL: ${{ secrets.KAOHSIUNG_EMAIL }}
      KAOHSIUNG_PASSWORD: ${{ secrets.KAOHSIUNG_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Verify Jenny OAuth secrets
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
      - name: Run monthly task
        shell: bash
        run: |
          set +e
          TODAY=$(TZ=Asia/Taipei date +"%Y%m%d"); LOG_DIR="logs/$TODAY"; mkdir -p "$LOG_DIR"
          TASK="${{ github.event.inputs.target }}"; PERIOD="${{ github.event.inputs.period }}"; FOLDER_ID="${{ github.event.inputs.folder_id }}"; AREA="${{ github.event.inputs.area }}"
          [ -z "$FOLDER_ID" ] && FOLDER_ID="$MONTHLY_ROOT_FOLDER_ID"
          START_TS=$(date +%s); START_TEXT=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S")
          CMD="python -u -m tools.scheduled_monthly.scheduler --target '$TASK' --folder-id '$FOLDER_ID' --area '$AREA'"
          [ -n "$PERIOD" ] && CMD="$CMD --period '$PERIOD'"
          bash -lc "$CMD" > "$LOG_DIR/monthly_${TASK}.log" 2>&1; EXIT_CODE=$?
          END_TS=$(date +%s); END_TEXT=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S"); DURATION=$((END_TS-START_TS))
          echo "$EXIT_CODE" > "$LOG_DIR/monthly_${TASK}.exit"
          [ "$EXIT_CODE" -eq 0 ] && STATUS="success" || STATUS="failed"
          printf '{"job_name":"monthly_%s","status":"%s","exit_code":%s,"started_at":"%s","finished_at":"%s","duration_seconds":%s}\n' "$TASK" "$STATUS" "$EXIT_CODE" "$START_TEXT" "$END_TEXT" "$DURATION" > "$LOG_DIR/monthly_${TASK}.json"
          cat "$LOG_DIR/monthly_${TASK}.log"
          exit "$EXIT_CODE"
      - name: Commit logs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f logs
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly logs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
