name: Scheduled Service Jobs

on:
  schedule:
    - cron: "0 22 * * *" # 台灣時間 06:00

  workflow_dispatch:
    inputs:
      target:
        description: "要執行的任務"
        required: true
        default: "service_all"
        type: choice
        options:
          - service_all
          - service_schedule_stats
          - service_daily_report
          - service_revenue

permissions:
  contents: write

jobs:
  run-service-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

      SERVICE_SOURCE_FROM_DAILY: "1"

      TOOLS_APP_LOG_SPREADSHEET_ID: ${{ secrets.TOOLS_APP_LOG_SPREADSHEET_ID || secrets.MASTER_SPREADSHEET_ID }}
      MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}

      SERVICE_TARGET_SPREADSHEET_ID: ${{ secrets.SERVICE_TARGET_SPREADSHEET_ID || secrets.LEMON_TARGET_FILE_ID }}
      LEMON_TARGET_FILE_ID: ${{ secrets.LEMON_TARGET_FILE_ID }}
      LOG_SPREADSHEET_ID: ${{ secrets.LOG_SPREADSHEET_ID }}

      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      NOTIFY_PASSWORD: ${{ secrets.NOTIFY_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail

          check_secret() {
            NAME="$1"
            VALUE="$2"

            if [ -z "$VALUE" ]; then
              echo "❌ 缺少 GitHub Secret：$NAME"
              exit 1
            fi

            echo "✅ 已設定：$NAME"
          }

          check_secret "GOOGLE_SERVICE_ACCOUNT" "$GOOGLE_SERVICE_ACCOUNT"
          check_secret "GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_ID"
          check_secret "GOOGLE_OAUTH_CLIENT_SECRET" "$GOOGLE_OAUTH_CLIENT_SECRET"
          check_secret "GOOGLE_OAUTH_REFRESH_TOKEN" "$GOOGLE_OAUTH_REFRESH_TOKEN"
          check_secret \
            "SERVICE_TARGET_SPREADSHEET_ID 或 LEMON_TARGET_FILE_ID" \
            "$SERVICE_TARGET_SPREADSHEET_ID"
          check_secret \
            "TOOLS_APP_LOG_SPREADSHEET_ID 或 MASTER_SPREADSHEET_ID" \
            "$TOOLS_APP_LOG_SPREADSHEET_ID"

      - name: Decide task
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ github.event.inputs.target }}"
          else
            TASK="service_all"
          fi

          if [ -z "$TASK" ]; then
            echo "❌ 沒有取得客服排程任務"
            exit 1
          fi

          echo "event_name=${{ github.event_name }}"
          echo "event_schedule=${{ github.event.schedule }}"
          echo "selected_task=$TASK"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"

      - name: Run service task
        shell: bash
        run: |
          set +e

          TODAY=$(TZ=Asia/Taipei date +"%Y%m%d")
          LOG_DIR="logs/$TODAY"
          TASK="${{ steps.decide.outputs.task }}"
          FAILED=0
          EXECUTED=0

          mkdir -p "$LOG_DIR"

          echo "========================================"
          echo "執行來源：${{ github.event_name }}"
          echo "排程設定：${{ github.event.schedule }}"
          echo "台北時間：$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S")"
          echo "執行任務：$TASK"
          echo "========================================"

          run_one() {
            NAME="$1"
            shift

            START_TS=$(date +%s)
            START_TEXT=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S")
            LOG_FILE="$LOG_DIR/$NAME.log"

            EXECUTED=$((EXECUTED + 1))

            echo
            echo "🔵 開始執行：$NAME"
            echo "開始時間：$START_TEXT"

            "$@" > "$LOG_FILE" 2>&1
            EXIT_CODE=$?

            END_TS=$(date +%s)
            END_TEXT=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S")
            DURATION=$((END_TS - START_TS))

            echo "$EXIT_CODE" > "$LOG_DIR/$NAME.exit"

            if [ "$EXIT_CODE" -eq 0 ]; then
              STATUS="success"
            else
              STATUS="failed"
              FAILED=1
            fi

            printf \
              '{"job_name":"%s","status":"%s","exit_code":%s,"started_at":"%s","finished_at":"%s","duration_seconds":%s}\n' \
              "$NAME" \
              "$STATUS" \
              "$EXIT_CODE" \
              "$START_TEXT" \
              "$END_TEXT" \
              "$DURATION" \
              > "$LOG_DIR/$NAME.json"

            cat "$LOG_FILE"

            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "✅ 執行成功：$NAME"
            else
              echo "❌ 執行失敗：$NAME（exit $EXIT_CODE）"
            fi

            echo "結束時間：$END_TEXT"
            echo "執行秒數：$DURATION"

            return 0
          }

          if [ "$TASK" = "service_schedule_stats" ] || [ "$TASK" = "service_all" ]; then
            run_one \
              "service_schedule_stats" \
              python -u -m service_management.lemon_schedule_sync \
              --step 1
          fi

          if [ "$TASK" = "service_daily_report" ] || [ "$TASK" = "service_all" ]; then
            run_one \
              "service_daily_report" \
              python -u -m service_management.lemon_schedule_sync \
              --step 2
          fi

          if [ "$TASK" = "service_revenue" ] || [ "$TASK" = "service_all" ]; then
            run_one \
              "service_revenue" \
              python -u -m service_management.lemon_schedule_sync \
              --step 3
          fi

          if [ "$EXECUTED" -eq 0 ]; then
            echo "❌ 沒有執行任何客服排程程式：TASK=$TASK"
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ 本次客服排程有一項或多項任務失敗"
            exit 1
          fi

          echo "✅ 本次客服排程全部執行成功"
          exit 0

      - name: Commit logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "logs" ]; then
            echo "沒有 logs 目錄"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f logs

          if git diff --cached --quiet; then
            echo "沒有新的 Log 需要提交"
            exit 0
          fi

          git commit -m "Update service logs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "✅ 客服排程 Log 已提交"
