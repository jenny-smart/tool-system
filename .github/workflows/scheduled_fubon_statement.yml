name: Scheduled Fubon Statement Download

on:
  schedule:
    # UTC 時間；台北時間需加 8 小時
    - cron: "0 0 * * *"   # 台北 08:00
    - cron: "0 2 * * *"   # 台北 10:00
    - cron: "0 4 * * *"   # 台北 12:00
    - cron: "0 6 * * *"   # 台北 14:00
    - cron: "0 8 * * *"   # 台北 16:00
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  queue-fubon-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      TOOLS_APP_LOG_SPREADSHEET_ID: ${{ secrets.TOOLS_APP_LOG_SPREADSHEET_ID || secrets.MASTER_SPREADSHEET_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Queue 台北／台中 Fubon 明細下載任務
        run: python -u -m tools.scheduled_daily.fubon_statement_queue
