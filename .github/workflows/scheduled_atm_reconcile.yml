name: Scheduled ATM Reconcile

on:
  schedule:
    # UTC 時間；台北時間需加 8 小時
    - cron: "0 3 * * *"   # 台北 11:00
    - cron: "0 7 * * *"   # 台北 15:00
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  atm-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      LEMON_EMAIL: ${{ secrets.LEMON_EMAIL }}
      LEMON_PASSWORD: ${{ secrets.LEMON_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICE_ACCOUNT LEMON_EMAIL LEMON_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "❌ 缺少 GitHub Secret：$name"
              exit 1
            fi
            echo "✅ 已設定：$name"
          done

      - name: 台北／台中 ATM 對帳（僅處理新增列）
        run: python -u -m tools.scheduled_daily.atm_reconcile_auto
